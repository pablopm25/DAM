<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card bg-dark border-secondary shadow-lg text-white">
        <div class="card-header border-secondary bg-transparent text-center py-4">
          <i class="bi bi-person-circle text-info" style="font-size: 4rem;"></i>
          <h3 class="mt-2 fw-bold">{{ usuario?.nombre }}</h3>
          <span class="badge bg-info text-dark text-uppercase">{{ usuario?.rol }}</span>
        </div>
        
        <div class="card-body p-4">
          <div class="mb-4">
            <label class="text-white-50 small text-uppercase fw-bold">Correo Electrónico</label>
            <p class="fs-5">{{ usuario?.email }}</p>
          </div>

          <div class="p-3 rounded bg-black bg-opacity-25 border border-secondary mb-4 text-center">
            <label class="text-white-50 small text-uppercase fw-bold d-block mb-1">Saldo Disponible</label>
            <h2 class="text-success fw-bold m-0">{{ usuario?.saldo | currency:'EUR' }}</h2>
          </div>

          <h6 class="text-white-50 small text-uppercase fw-bold mb-3">Recarga rápida (Simulación)</h6>
          <div class="d-flex gap-2">
            <button (click)="recargar(50)" class="btn btn-outline-success flex-fill fw-bold">+50€</button>
            <button (click)="recargar(100)" class="btn btn-outline-success flex-fill fw-bold">+100€</button>
            <button (click)="recargar(500)" class="btn btn-outline-success flex-fill fw-bold">+500€</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
