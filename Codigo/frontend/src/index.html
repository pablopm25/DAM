<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Componentes 360 | Tu tienda Gaming Premium</title>
  <base href="/">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #0f172a; 
      color: #f1f5f9;
      margin: 0;
      font-family: 'Rajdhani', sans-serif; 
    }
    
    .app-loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #38bdf8;
      background-color: #0f172a;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; text-shadow: 0 0 0 rgba(56, 189, 248, 0); }
      50% { transform: scale(1.1); opacity: 0.8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.8); }
      100% { transform: scale(1); opacity: 1; text-shadow: 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>

</head>
<body>
  
  <app-root>
    <div class="app-loading">
      <i class="bi bi-cpu" style="font-size: 4rem; animation: pulse 2s infinite ease-in-out;"></i>
      <h2 style="margin-top: 1.5rem; font-weight: 600; letter-spacing: 3px;">INICIANDO SISTEMA...</h2>
    </div>
  </app-root>

</body>
</html>
